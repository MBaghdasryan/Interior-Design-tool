# Renovara — local / VPS stack. `docker compose up --build`, then open http://localhost:8085
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma}
      POSTGRES_DB: forma
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]  # queue survives restarts
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://forma:${POSTGRES_PASSWORD:-forma}@db:5432/forma
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8085}
      MAIL_DIR: /data/mail
    volumes: [storage:/data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      retries: 10
    ports: ["8000:8000"]

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://forma:${POSTGRES_PASSWORD:-forma}@db:5432/forma
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      MAIL_DIR: /data/mail
    volumes: [storage:/data]
    depends_on:
      api: { condition: service_healthy }  # api runs the migrations first
      redis: { condition: service_healthy }
    stop_grace_period: 2m  # SIGTERM → RQ warm shutdown: the running job finishes
    deploy:
      replicas: 1

  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["8085:80"]

volumes:
  pgdata:
  storage:
  redisdata:
