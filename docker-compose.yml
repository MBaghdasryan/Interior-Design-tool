# Renovara — local / VPS stack. `docker compose up --build`, then open http://localhost:8085
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma}
      POSTGRES_DB: forma
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]  # queue survives restarts
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://forma:${POSTGRES_PASSWORD:-forma}@db:5432/forma
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: ${CLAMAV_HOST:-}  # "clamav" with `--profile av`
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8085}
      MAIL_DIR: /data/mail
    volumes: [storage:/data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      retries: 10
    ports: ["8000:8000"]

  # Antivirus for uploads (clamd INSTREAM). Opt-in locally: `docker compose --profile av up -d`,
  # then set CLAMAV_HOST=clamav in .env. Always on in the production profile. Needs ~1.5 GB RAM;
  # the first start downloads signatures (several minutes).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["av"]
    volumes: [clamdb:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 300s

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://forma:${POSTGRES_PASSWORD:-forma}@db:5432/forma
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      MAIL_DIR: /data/mail
    volumes: [storage:/data]
    depends_on:
      api: { condition: service_healthy }  # api runs the migrations first
      redis: { condition: service_healthy }
    stop_grace_period: 2m  # SIGTERM → RQ warm shutdown: the running job finishes
    deploy:
      replicas: 1

  worker-catalog:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]  # catalogue crawls / feeds / search index only
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://forma:${POSTGRES_PASSWORD:-forma}@db:5432/forma
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8085}
      MAIL_DIR: /data/mail
      WORKER_QUEUES: forma-catalog
    volumes: [storage:/data]
    depends_on:
      api: { condition: service_healthy }  # api runs the migrations first
      redis: { condition: service_healthy }
    stop_grace_period: 2m  # SIGTERM → RQ warm shutdown: the running job finishes
    deploy:
      replicas: 1

  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["8085:80"]

volumes:
  pgdata:
  storage:
  redisdata:
  clamdb:
