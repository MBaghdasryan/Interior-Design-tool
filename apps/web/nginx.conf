server {
  listen 80;
  server_name _;
  client_max_body_size 512m;
  root /usr/share/nginx/html;

  # Baseline security headers. CSP runs in Report-Only until the APS Viewer (blob: workers, wss) is verified under enforcement.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://developer.api.autodesk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://developer.api.autodesk.com; font-src 'self' https://fonts.gstatic.com https://developer.api.autodesk.com; img-src 'self' data: blob: https://*.autodesk.com; connect-src 'self' https://*.autodesk.com wss://*.autodesk.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE progress stream
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location / {
    try_files $uri /index.html;
  }
}
