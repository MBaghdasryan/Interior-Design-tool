name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, unit/integration tests, artifact validation
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements*.txt }
      - run: sudo apt-get update -q && sudo apt-get install -yq fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests evals
      - name: Tests (unit + integration, SQLite, fakeredis, moto)
        run: python -m pytest -q -p no:cacheprovider
      - name: OpenAPI document is in sync (frontend contract source)
        run: python -m app.openapi_export ../web/openapi.json --check
        env: { SECRET_KEY: ci-openapi, DATABASE_URL: "sqlite:////tmp/openapi.db" }
      - name: Artifact validation (A3 PDF, DXF, GLB, XLSX, CSV, JSON)
        run: python -m pytest -q -p no:cacheprovider tests/test_artifacts.py

  migrations:
    name: Migrations — upgrade / downgrade / upgrade on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: forma, POSTGRES_PASSWORD: forma, POSTGRES_DB: forma }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forma" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://forma:forma@localhost:5432/forma
      ENV: ci
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements*.txt }
      - run: pip install -r requirements.txt
      - run: alembic upgrade head && alembic current
      - run: alembic downgrade 0001_baseline && alembic current
      - run: alembic upgrade head && alembic current | grep "(head)"

  frontend:
    name: Frontend — i18n, typecheck, build, audit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: i18n coverage (hy/ru/en, no hardcoded strings)
        run: node scripts/i18n-check.mjs
      - name: Server dictionary is in sync
        run: node --experimental-strip-types --no-warnings scripts/export-server-dict.mjs --check
      - name: OpenAPI → TypeScript types are in sync
        run: npm run -s api:types && git diff --exit-code src/lib/api-types.ts
      - name: API contract (every frontend call exists in OpenAPI)
        run: npm run -s api:check
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Production build
        run: npx vite build
      - name: Dependency audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Security — pip-audit, container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit (runtime requirements)
        run: pip install pip-audit==2.7.3 && pip-audit -r apps/api/requirements.txt --progress-spinner off
      - name: Build images
        run: |
          docker build -t renovara-api:ci apps/api
          docker build -t renovara-web:ci apps/web
      - name: Trivy image scan (critical, fixable)
        # the scanner runs from its pinned image; no third-party action
        run: |
          for img in renovara-api:ci renovara-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image \
              --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$img"
          done

  e2e:
    name: E2E — compose stack, visual regression, a11y (axe), auth / i18n / routes (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configure stack (no keys → deterministic AI stub, no live catalogue requests)
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|; s|^EXTERNAL_FETCH_LIVE=.*|EXTERNAL_FETCH_LIVE=false|" .env
      - name: Start stack
        run: docker compose -p renovara-ci up -d --build --wait --wait-timeout 300
      - name: Seed demo variants
        run: python3 apps/web/e2e/seed_e2e.py
      - name: Playwright suites
        run: |
          docker run --rm --network host -e BASE=http://localhost:8085 -e OUT=/out \
            -v renovara-ci_storage:/apidata:ro -v "$PWD/apps/web/e2e:/e2e" -v "$PWD/e2e-out:/out" \
            mcr.microsoft.com/playwright/python:v1.49.0-jammy sh -c \
            "pip install -q playwright==1.49.0 axe-playwright-python==0.1.4 pillow==11.0.0 && python /e2e/visual_a11y_e2e.py && python /e2e/auth_e2e.py && python /e2e/i18n_e2e.py && python /e2e/routes_smoke.py && python /e2e/notifications_e2e.py && python /e2e/catalog_ops_e2e.py && python /e2e/commerce_e2e.py"
      - name: Logs on failure
        if: failure()
        run: docker compose -p renovara-ci logs --tail 200 > e2e-out/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: e2e-out, retention-days: 7 }

  images:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend, security, e2e]
    if: github.event_name == 'push'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: names
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.names.outputs.repo }}/renovara-api:${{ github.sha }},${{ steps.names.outputs.repo }}/renovara-api:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ steps.names.outputs.repo }}/renovara-web:${{ github.sha }},${{ steps.names.outputs.repo }}/renovara-web:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

  deploy-staging:
    name: Deploy to staging (tags v*)
    runs-on: ubuntu-latest
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    env:
      HAS_STAGING: ${{ secrets.STAGING_HOST != '' }}
    steps:
      - name: Staging not configured
        if: env.HAS_STAGING != 'true'
        run: echo "::warning::STAGING_HOST / STAGING_SSH_KEY secrets are not set — deployment skipped (BLOCKED_BY_EXTERNAL_DEPENDENCY)"
      - name: Pull and restart on the staging host
        if: env.HAS_STAGING == 'true'
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "${USER:-deploy}@$HOST" \
            "cd /opt/renovara && git fetch --tags && git checkout ${{ github.ref_name }} && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build && \
             scripts/backup.sh >/dev/null && curl -fsS https://\$(grep ^DOMAIN= .env.prod | cut -d= -f2)/api/ready"
